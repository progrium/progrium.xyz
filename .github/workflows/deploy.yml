name: Build and Deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          check-latest: true

      - name: Install Taragen
        run: go install github.com/progrium/taragen/cmd/taragen@main

      - name: Build
        run: |
          taragen build
          # GitHub Pages runs Jekyll unless told not to, and Jekyll drops
          # underscore paths like /_assets and /_redirects.
          touch _public/.nojekyll

      # Only main deploys. Other branches and pull requests just check that the site builds.
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _public
